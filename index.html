<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        var stored = localStorage.getItem('harbour-theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        var accent = localStorage.getItem('harbour-accent')
        if (accent === 'tide' || accent === 'copper' || accent === 'harbour') document.documentElement.dataset.accent = accent
      } catch (e) {}
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <!-- harbour-meta:start -->
    <title>Harbour</title>
    <meta
      name="description"
      content="Harbour is a personal price watch for Hamilton, Ontario. Canadian store prices in CAD."
    />
    <meta property="og:title" content="Harbour" />
    <meta
      property="og:description"
      content="Harbour is a personal price watch for Hamilton, Ontario. Canadian store prices in CAD."
    />
    <meta property="og:image" content="https://harieshwar-ai.github.io/deal-tracker/og.jpg" />
    <meta property="og:url" content="https://harieshwar-ai.github.io/deal-tracker/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- harbour-meta:end -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
